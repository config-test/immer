version: 2.1

jobs:
  immer:
    docker:
      - image: cimg/node:26.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-immer-yarn-node-26.11-{{ checksum "yarn.lock" }}
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile --non-interactive --cache-folder ~/.cache/yarn
      - save_cache:
          key: v1-immer-yarn-node-26.11-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
      - run:
          name: Build
          command: yarn build
      - run:
          name: Test source, production build, and Flow types
          command: yarn test

workflows:
  ci:
    jobs:
      - immer
