version: 2.1

jobs:
  immer:
    docker:
      - image: cimg/node:24.21
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "yarn.lock" }}
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - save_cache:
          key: v1-deps-{{ checksum "yarn.lock" }}
          paths:
            - node_modules
            - ~/.cache/yarn
      - run:
          name: Build
          command: yarn build
      - run:
          name: Test
          command: yarn test
      # No lint script in package.json (Prettier via husky pre-commit only).

  website:
    docker:
      - image: cimg/node:24.21
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-website-deps-{{ checksum "website/yarn.lock" }}
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
          working_directory: website
      - save_cache:
          key: v1-website-deps-{{ checksum "website/yarn.lock" }}
          paths:
            - website/node_modules
            - ~/.cache/yarn
      - run:
          name: Build
          command: yarn build
          working_directory: website
      # No test or lint scripts in website/package.json.

workflows:
  build-and-test:
    jobs:
      - immer
      - website
